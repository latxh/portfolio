  <!-- Resolves the theme before first paint, and ahead of the render-blocking
       script below, so a stored choice never flashes the other theme first. -->
  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("has-js");
      var stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch (error) {
        // storage can be blocked outright — fall through to the system setting
      }
      root.dataset.theme =
        stored === "light" || stored === "dark"
          ? stored
          : window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
    })();
  </script>
